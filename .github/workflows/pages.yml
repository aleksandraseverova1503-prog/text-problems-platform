name: Deploy platform to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v12
        run: |
          echo "Checking archive fragments"
          test "$(git hash-object bundle2/part07.txt)" = "cb61d9654b992f0cb5accc001023ff09ef29958a"

          head -c 16000 bundle/part11_12.txt > /tmp/1112.txt
          test "$(git hash-object /tmp/1112.txt)" = "cb8cf34c4af0c32be5001aa75647d7fb125f8e9a"

          cp bundle/part13_14.txt /tmp/1314.txt
          printf '5' >> /tmp/1314.txt
          test "$(git hash-object /tmp/1314.txt)" = "0c7114fc297aebe08ad265551390e1d9d2732489"

          cat \
            bundle/part00.txt \
            bundle/part01.txt \
            bundle/part02.txt \
            bundle/part03.txt \
            bundle/part04.txt \
            bundle/part05.txt \
            bundle/part06.txt \
            bundle2/part07.txt \
            bundle/part09_10.txt \
            /tmp/1112.txt \
            /tmp/1314.txt \
            bundle/part15_16.txt \
            bundle/part17.txt \
            > /tmp/v12.b64

          test "$(wc -c < /tmp/v12.b64)" -eq 137432
          base64 -d /tmp/v12.b64 > /tmp/v12.zip
          unzip -tq /tmp/v12.zip

          mkdir -p /tmp/unpack _site
          unzip -q /tmp/v12.zip -d /tmp/unpack
          cp -a /tmp/unpack/text-problems-platform-full-v12/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/modules/movement/index.html
          test -f _site/shared/lesson-tools.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
