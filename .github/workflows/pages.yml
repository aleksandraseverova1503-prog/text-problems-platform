name: Deploy platform to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror current platform
        run: |
          mkdir -p _site
          cd _site
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
            --directory-prefix=. \
            https://6a9e48175056d37da36b8611--alex-math-text-problems.netlify.app/
          if [ -d 6a9e48175056d37da36b8611--alex-math-text-problems.netlify.app ]; then
            cp -a 6a9e48175056d37da36b8611--alex-math-text-problems.netlify.app/. .
            rm -rf 6a9e48175056d37da36b8611--alex-math-text-problems.netlify.app
          fi
          touch .nojekyll
          test -f index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
